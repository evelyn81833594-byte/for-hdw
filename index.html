<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#070b18">
<title>她的两年 · 星海展厅</title>
<style>
:root{
  --bg:#070b18;
  --bg2:#0d1730;
  --ink:#e9eefc;
  --dim:#93a2c4;
  --gold:#f2c17a;
  --gold2:#ffdca6;
  --paper:#f7f2e7;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","Xingkai SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow-x:hidden}
body{-webkit-font-smoothing:antialiased}
img{max-width:100%}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.layer{position:relative;z-index:2}

/* ── 固定 UI ───────────────────────────── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:50;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;justify-content:space-between;align-items:center;
  pointer-events:none;
}
#progress{
  font-size:12px;letter-spacing:.12em;color:var(--dim);
  background:rgba(7,11,24,.5);backdrop-filter:blur(6px);
  border:1px solid rgba(242,193,122,.22);border-radius:20px;
  padding:5px 12px;opacity:0;transition:opacity .8s;
}
#progress.show{opacity:1}
#progress b{color:var(--gold);font-weight:600}
#musicBtn{
  position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);
  z-index:60;width:44px;height:44px;border-radius:50%;
  border:1px solid rgba(242,193,122,.35);background:rgba(7,11,24,.6);
  backdrop-filter:blur(6px);color:var(--gold);font-size:17px;
  display:none;align-items:center;justify-content:center;
  transition:transform .3s,opacity .3s;
}
#musicBtn.show{display:flex}
#musicBtn.playing{animation:spin 8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#musicBtn.paused{opacity:.45}

/* ── 封面 ─────────────────────────────── */
#gate{
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px 28px;position:relative;
}
#gate .lamp{font-size:26px;color:var(--gold);opacity:.8;margin-bottom:26px;animation:breathe 4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.4;transform:scale(.94)}50%{opacity:.95;transform:scale(1.06)}}
#gate h1{
  font-family:var(--serif);font-weight:400;
  font-size:clamp(26px,7.2vw,38px);letter-spacing:.16em;
  margin:0 0 18px;line-height:1.6;
}
#gate .sub{font-family:var(--kai);font-size:15px;color:var(--dim);letter-spacing:.2em;margin-bottom:8px}
#gate .tip{margin-top:34px;font-size:12.5px;color:#6b799c;letter-spacing:.16em;line-height:2}
#enter{
  margin-top:26px;width:88px;height:88px;border-radius:50%;
  border:1px solid rgba(242,193,122,.55);background:transparent;
  color:var(--gold);font-family:var(--kai);font-size:16px;letter-spacing:.2em;
  position:relative;cursor:pointer;
}
#enter::after{
  content:"";position:absolute;inset:-1px;border-radius:50%;
  border:1px solid rgba(242,193,122,.5);animation:ripple 2.6s ease-out infinite;
}
@keyframes ripple{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.55);opacity:0}}
#enter span{display:block}
#enter small{display:block;font-size:10px;letter-spacing:.1em;color:var(--dim);margin-top:4px;font-family:var(--sans)}

/* ── 通用段落 ─────────────────────────── */
.wrap{max-width:660px;margin:0 auto;padding:0 26px}
.eyebrow{font-family:var(--kai);font-size:12.5px;letter-spacing:.3em;color:var(--gold);opacity:.85}
h2.lit{font-family:var(--serif);font-weight:400;font-size:clamp(20px,5.4vw,26px);letter-spacing:.08em;line-height:1.8;margin:14px 0 20px}
p.story{font-family:var(--serif);font-size:16.5px;line-height:2.15;color:#d5deF2;letter-spacing:.04em;margin:0 0 18px;text-align:justify}

/* ── 序章 ─────────────────────────────── */
#prologue{padding:96px 0 40px;opacity:0;transform:translateY(24px);transition:opacity 1.4s,transform 1.4s}
#prologue.in{opacity:1;transform:none}
#prologue .frame{
  margin:40px 0 10px;position:relative;
  display:flex;justify-content:center;
}

/* ── 展厅 ─────────────────────────────── */
#hall{max-width:680px;margin:0 auto;padding:60px 26px 40px;position:relative}
#hall::before{
  content:"";position:absolute;left:38px;top:80px;bottom:80px;width:1px;
  background:linear-gradient(to bottom,transparent,rgba(242,193,122,.28) 8%,rgba(242,193,122,.28) 92%,transparent);
}
.exhibit{position:relative;padding-left:40px;margin-bottom:104px;opacity:0;transform:translateY(30px);transition:opacity 1.1s ease,transform 1.1s ease}
.exhibit.in{opacity:1;transform:none}
.exhibit .dot{
  position:absolute;left:-6px;top:9px;width:11px;height:11px;border-radius:50%;
  background:#2a3552;border:1px solid rgba(242,193,122,.35);
  transition:background .9s,box-shadow .9s,border-color .9s;
}
.exhibit.in .dot{background:var(--gold);border-color:var(--gold2);box-shadow:0 0 0 4px rgba(242,193,122,.13),0 0 16px 3px rgba(242,193,122,.55)}
.exhibit .date{font-family:var(--kai);font-size:13px;letter-spacing:.22em;color:var(--gold);opacity:.9;margin-bottom:12px}
.exhibit h3{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:.06em;margin:26px 0 14px;line-height:1.7}
.exhibit .story{font-size:16px;line-height:2.1}

/* 拍立得 */
.polaroid{
  position:relative;width:min(100%,300px);
  background:var(--paper);padding:11px 11px 0;border-radius:2px;
  box-shadow:0 20px 44px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.5) inset;
  transform:rotate(var(--r,0deg));transition:transform .9s cubic-bezier(.2,.8,.2,1);
}
.exhibit.in .polaroid{transform:rotate(var(--r2,0deg))}
.tape{
  position:absolute;top:-11px;left:50%;width:82px;height:23px;
  background:linear-gradient(180deg,rgba(242,193,122,.62),rgba(242,193,122,.4));
  border-left:1px dashed rgba(255,255,255,.35);border-right:1px dashed rgba(255,255,255,.35);
  transform:translateX(-50%) rotate(-3deg);
}
.photo{
  width:100%;aspect-ratio:4/3;display:block;object-fit:cover;object-position:center 42%;background:#1b2237;
  filter:grayscale(1) blur(7px) brightness(.62) contrast(1.1);opacity:.35;
  transition:filter 1.5s ease,opacity 1.5s ease;
}
.exhibit.in .photo{filter:none;opacity:1}
.pstack{position:relative;width:100%;aspect-ratio:4/3;background:#1b2237;overflow:hidden}
.pstack .photo{
  position:absolute;object-fit:cover;object-position:center 42%;
  aspect-ratio:4/3;height:88%;width:auto;
  filter:grayscale(1) blur(7px) brightness(.62) contrast(1.1) !important;opacity:.35;
  transition:filter 1.5s ease,opacity 1.5s ease;
}
/* 像一叠照片摊在桌上：错开、微微歪斜、白边 */
.pstack .photo.s0{left:1%;top:2%;transform:rotate(-3deg)}
.pstack .photo.s1{left:15%;top:11%;transform:rotate(2.6deg);border:3px solid #fdfaf2;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.pstack .photo.s2{left:8%;top:22%;transform:rotate(-1.8deg);border:3px solid #fdfaf2;
  box-shadow:0 8px 22px rgba(0,0,0,.5)}
.exhibit.in .pstack .photo{filter:none !important;opacity:1 !important}
.photo-ph{
  width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;
  background:linear-gradient(150deg,#1a2338,#0e1628 60%,#18213a);
  color:#5d6c92;font-family:var(--kai);font-size:13px;letter-spacing:.18em;
}
.photo-ph em{font-style:normal;font-size:10.5px;color:#41506f;letter-spacing:.1em}
.polaroid .cap{
  font-family:var(--kai);font-size:13px;color:#8a7250;text-align:center;
  padding:12px 6px 13px;letter-spacing:.06em;
}

/* ── 星海 ─────────────────────────────── */
#starsea{
  position:relative;height:100vh;height:100dvh;width:100%;
  overflow:hidden;
}
#sc{position:absolute;inset:0;width:100%;height:100%}
#seahint{
  position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 96px);
  text-align:center;font-family:var(--kai);font-size:13px;letter-spacing:.2em;
  color:var(--dim);transition:opacity .8s;padding:0 24px;line-height:2;
}
#seatitle{
  position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 74px);
  text-align:center;font-family:var(--kai);font-size:12.5px;letter-spacing:.5em;
  color:var(--gold);opacity:.55;pointer-events:none;
}
#linkBtn{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 34px);
  padding:13px 30px;border-radius:30px;
  border:1px solid rgba(242,193,122,.5);background:rgba(242,193,122,.07);
  color:var(--gold);font-family:var(--kai);font-size:15px;letter-spacing:.22em;
  backdrop-filter:blur(4px);cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .9s,transform .4s;
}
#linkBtn.show{opacity:1;pointer-events:auto}
#linkBtn:active{transform:translateX(-50%) scale(.96)}
#linkBtn.done{opacity:0;pointer-events:none}

/* 星点卡片 */
#card{
  position:fixed;inset:0;z-index:70;display:none;
  align-items:center;justify-content:center;padding:28px;
  background:rgba(5,8,17,.72);backdrop-filter:blur(8px);
}
#card.show{display:flex;animation:fadeIn .45s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#card .inner{
  max-width:400px;width:100%;max-height:78dvh;overflow-y:auto;
  background:linear-gradient(170deg,rgba(20,28,52,.96),rgba(11,17,34,.96));
  border:1px solid rgba(242,193,122,.3);border-radius:14px;padding:26px 24px 24px;
  box-shadow:0 30px 70px rgba(0,0,0,.6);
}
#card .cd{font-family:var(--kai);font-size:12.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:10px}
#card h4{font-family:var(--serif);font-weight:400;font-size:19px;letter-spacing:.06em;margin:0 0 14px;line-height:1.7}
#card .ct{font-family:var(--serif);font-size:15.5px;line-height:2.05;color:#cfd9f0;margin-bottom:20px;text-align:justify}
#card .cph{
  width:100%;aspect-ratio:4/3;border-radius:4px;object-fit:cover;object-position:center 42%;background:#1b2237;
  margin-bottom:16px;display:block;
}
#card .close{
  display:block;width:100%;padding:11px;border:1px solid rgba(242,193,122,.32);
  border-radius:24px;background:transparent;color:var(--dim);
  font-family:var(--kai);font-size:14px;letter-spacing:.2em;cursor:pointer;
}

/* ── NASA 背景星空：极淡地铺在底色上，随滚动换图 ── */
.bglayer{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  overflow:hidden;
}
.bglayer .bgi{
  position:absolute;inset:-6%;
  width:112%;height:112%;object-fit:cover;object-position:center 45%;
  opacity:0;transform:scale(1.06);
  filter:saturate(.85) brightness(.85) contrast(1.05);
  mix-blend-mode:screen;
  transition:opacity 2.4s ease,transform 12s ease;
}
.bglayer .bgi.on{opacity:.20;transform:scale(1)}
/* 底部压暗，保证文字始终清楚 */
.bglayer::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse at 50% 38%,rgba(7,11,24,.28) 0%,rgba(7,11,24,.72) 62%,rgba(7,11,24,.92) 100%);
}

/* ── 网易云音乐卡片 ─────────────────────── */
.mcard{
  margin:26px auto 0;max-width:330px;width:88%;
  display:flex;align-items:center;gap:14px;
  padding:13px 15px;border-radius:14px;
  background:linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.035));
  border:1px solid rgba(242,193,122,.26);
  box-shadow:0 10px 30px rgba(0,0,0,.35);
  text-align:left;cursor:pointer;
  transition:transform .25s ease,border-color .25s ease;
}
.mcard:active{transform:scale(.97)}
.mcard .disc{
  flex:0 0 46px;height:46px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#3c4761,#2a3348 60%,#161d2e);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;color:var(--gold);
  box-shadow:0 4px 12px rgba(0,0,0,.4);
  position:relative;
}
.mcard .disc.cov{overflow:hidden;background:#1a2136}
.mcard .disc.cov img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.mcard .disc.cov::after{display:none}
.mcard .disc::after{
  content:"";position:absolute;width:13px;height:13px;border-radius:50%;
  background:#0f1524;box-shadow:inset 0 0 0 1px rgba(242,193,122,.35);
}
.mcard.on .disc{animation:spin 4s linear infinite}
.mcard .meta{flex:1;min-width:0}
.mcard .mt{font-family:var(--kai);font-size:14.5px;letter-spacing:.08em;color:#e8eefc;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcard .ma{font-size:11.5px;color:#8b9ac0;letter-spacing:.1em;margin-top:3px}
.mcard .mb{
  flex:0 0 auto;font-size:11.5px;letter-spacing:.1em;color:var(--gold);
  padding:6px 11px;border-radius:14px;border:1px solid rgba(242,193,122,.35);
  white-space:nowrap;
}
.mhint{margin:10px auto 0;font-size:11px;color:#5b6a8d;letter-spacing:.12em;line-height:1.8}

/* ── 尾声 ─────────────────────────────── */
#finale{padding:110px 0 130px;text-align:center;opacity:0;transform:translateY(20px);transition:opacity 1.6s,transform 1.6s}
#finale.in{opacity:1;transform:none}
#finale .big{font-family:var(--serif);font-size:clamp(21px,6vw,28px);letter-spacing:.1em;line-height:2;margin:18px 0 26px}
#finale .sig{font-family:var(--kai);font-size:14px;color:var(--dim);letter-spacing:.16em;margin-top:40px;line-height:2.2}
.note{
  margin-top:52px;border:1px dashed rgba(242,193,122,.32);border-radius:12px;
  padding:22px 20px;background:rgba(242,193,122,.04);text-align:left;
}
.note .nl{font-family:var(--kai);font-size:12.5px;letter-spacing:.22em;color:var(--gold);margin-bottom:12px}
.note textarea{
  width:100%;min-height:96px;background:transparent;border:none;resize:none;outline:none;
  color:#dfe6f7;font-family:var(--serif);font-size:15px;line-height:1.95;letter-spacing:.03em;
}
.note textarea::placeholder{color:#5b6a8d}
.note .acts{display:flex;gap:10px;margin-top:12px;justify-content:flex-end}
.note button{
  padding:8px 18px;border-radius:20px;border:1px solid rgba(242,193,122,.35);
  background:transparent;color:var(--gold);font-family:var(--kai);font-size:13px;
  letter-spacing:.14em;cursor:pointer;
}
.note .saved{margin-top:10px;font-size:12px;color:#6f7ea3;letter-spacing:.1em;min-height:16px}
#voiceBtn{
  display:none;margin:34px auto 0;padding:12px 26px;border-radius:26px;
  border:1px solid rgba(242,193,122,.4);background:rgba(242,193,122,.06);
  color:var(--gold);font-family:var(--kai);font-size:14.5px;letter-spacing:.18em;cursor:pointer;
}
/* ── 信件 ─────────────────────────────── */
.letter{
  position:relative;max-width:520px;margin:40px auto 0;
  background:
    repeating-linear-gradient(to bottom,transparent,transparent 34px,rgba(120,100,70,.10) 34px,rgba(120,100,70,.10) 35px),
    linear-gradient(168deg,#faf6ec 0%,#f4eee1 60%,#efe7d8 100%);
  color:#3d342a;border-radius:2px;padding:40px 26px 32px;
  box-shadow:0 26px 64px rgba(0,0,0,.55),0 2px 0 rgba(255,255,255,.6) inset;
  font-family:var(--kai);font-size:15.5px;line-height:2.05;letter-spacing:.03em;
  text-align:left;
}
.letter .lt{
  font-family:var(--serif);font-size:19px;letter-spacing:.14em;
  color:#7a4a1e;margin-bottom:22px;padding-bottom:14px;
  border-bottom:1px dashed rgba(120,100,70,.35);
}
.letter p{margin:0 0 16px}
.letter .hl{
  font-style:normal;color:#a0631f;border-bottom:1px solid rgba(160,99,31,.35);
  padding-bottom:1px;
}
.letter .names{
  margin:22px 0;padding:16px 0;
  border-top:1px dashed rgba(120,100,70,.28);
  border-bottom:1px dashed rgba(120,100,70,.28);
}
.letter .namesEnd{margin:0 0 8px;color:#5a4a35}
.letter .nm{font-style:normal;font-weight:600;color:#7a4a1e}
.letter .qs{margin:26px 0 8px}
.letter .q{
  opacity:0;transform:translateY(14px);
  transition:opacity 1s ease,transform 1s ease;
  margin:0 0 13px;color:#5a4a35;
}
.letter .q.in{opacity:1;transform:none}
.letter .q::before{content:"";display:inline-block;width:14px;height:1px;
  background:rgba(120,100,70,.5);vertical-align:middle;margin-right:9px}
.letter .unknown{margin-top:22px;color:#3d342a}
.letter .why{
  margin-top:30px;text-align:center;font-size:16px;color:#8a5a2b;letter-spacing:.1em;
}
.letter .answer{
  margin:12px 0 0;text-align:center;font-family:var(--serif);
  font-size:clamp(17px,4.6vw,21px);line-height:1.9;color:#7a4a1e;letter-spacing:.06em;
  opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s ease;
}
.letter .answer.in{opacity:1;transform:none}
.letter .lemb{
  margin:30px auto 6px;max-width:260px;text-align:center;
}
.letter .lemb img{
  width:100%;border-radius:3px;display:block;
  box-shadow:0 10px 26px rgba(0,0,0,.22);
  transform:rotate(-1.4deg);
}
.letter .lemb figcaption{
  margin-top:9px;font-size:12px;color:#8a7860;letter-spacing:.14em;
}
.letter .sign{
  margin-top:28px;text-align:right;font-size:13.5px;color:#8a7860;letter-spacing:.08em;
}
.letter .tape{
  background:linear-gradient(180deg,rgba(180,150,90,.45),rgba(180,150,90,.28));
  border-left:1px dashed rgba(255,255,255,.4);border-right:1px dashed rgba(255,255,255,.4);
}
.credit{margin-top:60px;font-size:11.5px;color:#4e5c7d;letter-spacing:.14em;line-height:2}
.keep{margin-top:46px;padding-top:32px;border-top:1px solid rgba(242,193,122,.16)}
.keep .kl{font-family:var(--kai);font-size:12.5px;letter-spacing:.2em;color:#7c8bab;margin-bottom:16px}
#keepBtn{
  padding:12px 26px;border-radius:26px;
  border:1px dashed rgba(242,193,122,.45);background:transparent;
  color:var(--gold);font-family:var(--kai);font-size:14.5px;letter-spacing:.18em;cursor:pointer;
}
#keepBtn:active{transform:scale(.96)}
#keepBtn:disabled{opacity:.5}
.keep .kt{margin-top:14px;font-size:11.5px;color:#5b6a8d;letter-spacing:.1em;line-height:1.9;min-height:18px}
</style>
</head>
<body>

<canvas id="sky"></canvas>

<audio id="bgm" loop preload="auto" playsinline></audio>
<audio id="voice" preload="none" playsinline></audio>

<div id="topbar"><div id="progress">已点亮 <b id="pCount">0</b> / <span id="pTotal">8</span></div><div></div></div>
<div id="musicBtn">♪</div>

<!-- ═══ 封面 ═══ -->
<div id="bgPhoto" class="bglayer"></div>
<section id="gate" class="layer">
  <div class="lamp">✦</div>
  <h1 id="gTitle">致 小满 的两年</h1>
  <div class="sub" id="gSub">2024 · 春 —— 2026 · 秋</div>
  <button id="enter"><span>推 门</span><small id="enterSub">建议戴上耳机</small></button>
  <div id="mCard"></div>
  <div class="tip">门后是一条走廊<br>走廊尽头是一片海</div>
</section>

<!-- ═══ 序章 ═══ -->
<section id="prologue" class="layer">
  <div class="wrap">
    <div class="eyebrow">序 · 两年前的她</div>
    <h2 class="lit" id="proTitle">那时候她还不知道，接下来这两年会发生什么。</h2>
    <div id="proText"></div>
    <div class="frame" id="proFrame"></div>
  </div>
</section>

<!-- ═══ 展厅 ═══ -->
<section id="hall" class="layer"></section>

<!-- ═══ 星海 ═══ -->
<section id="starsea" class="layer">
  <canvas id="sc"></canvas>
  <div id="seatitle">星 海</div>
  <div id="seahint">那些被点亮的时刻，都浮在这里了<br>点一点，可以再看一遍</div>
  <button id="linkBtn">把它们连起来</button>
</section>

/* ── 背景星空 ── */
const sky = $("sky"), sctx = sky.getContext("2d");
let SW = 0, SH = 0, DPR = 1, bgStars = [], shoot = null;
function sizeSky(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = window.innerWidth; SH = window.innerHeight;
  sky.width = SW * DPR; sky.height = SH * DPR;
  sctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
function makeBgStars(){
  const n = Math.round(Math.min(170, Math.max(90, SW * SH / 5200)));
  bgStars = Array.from({ length: n }, () => ({
    x: Math.random() * SW, y: Math.random() * SH,
    r: Math.random() * 1.15 + .25,
    a: Math.random() * .55 + .18,
    sp: Math.random() * .0085 + .002,
    ph: Math.random() * Math.PI * 2,
    vy: Math.random() * .022 + .006
  }));
}
function drawSky(t){
  sctx.clearRect(0, 0, SW, SH);
  const g = sctx.createRadialGradient(SW * .5, SH * .38, 0, SW * .5, SH * .38, Math.max(SW, SH) * .85);
  g.addColorStop(0, "#0e1832"); g.addColorStop(1, "#070b18");
  sctx.fillStyle = g; sctx.fillRect(0, 0, SW, SH);

  for (const s of bgStars){
    s.y -= s.vy; if (s.y < -4) { s.y = SH + 4; s.x = Math.random() * SW; }
    const tw = s.a * (0.62 + 0.38 * Math.sin(t * s.sp + s.ph));
    sctx.beginPath(); sctx.arc(s.x, s.y, s.r, 0, 6.2832);
    sctx.fillStyle = `rgba(226,236,255,${tw})`; sctx.fill();
  }
  if (!shoot && Math.random() < 0.0016){
    shoot = { x: Math.random() * SW * .8 + SW * .1, y: Math.random() * SH * .4, l: Math.random() * 90 + 60, p: 0 };
  }
  if (shoot){
    shoot.p += .022;
    const prog = shoot.p, len = shoot.l;
    const x = shoot.x + prog * len * 3.2, y = shoot.y + prog * len * 1.5;
    const gr = sctx.createLinearGradient(x, y, x - len * .7, y - len * .32);
    gr.addColorStop(0, `rgba(255,240,214,${(1 - prog) * .85})`);
    gr.addColorStop(1, "rgba(255,240,214,0)");
    sctx.strokeStyle = gr; sctx.lineWidth = 1.4;
    sctx.beginPath(); sctx.moveTo(x, y); sctx.lineTo(x - len * .7, y - len * .32); sctx.stroke();
    if (prog >= 1) shoot = null;
  }
}

/* ── 渲染内容 ── */
function polaroidHTML(ex, i){
  const r1 = (i % 2 ? 2.6 : -2.2) + (i * 0.7 % 1.4);
  const r2 = (i % 2 ? -1.1 : 1.3);
  let ph;
  const pList = Array.isArray(ex.photo) ? ex.photo.filter(Boolean)
              : (ex.photo ? [ex.photo] : []);
  if (pList.length){
    ph = pList.length > 1
      ? `<div class="pstack">` + pList.map((src, k) =>
          `<img class="photo s${k}" src="${src}" alt="${T(ex.title)}" loading="lazy">`
        ).join("") + `</div>`
      : `<img class="photo" src="${pList[0]}" alt="${T(ex.title)}" loading="lazy">`;
  } else if (ex.noPhoto){
    ph = `<div class="photo-ph"><div>${T(ex.noPhoto[0])}</div><em>${T(ex.noPhoto[1] || "")}</em></div>`;
  } else {
    ph = `<div class="photo-ph"><div>照 片 ${String(i + 1).padStart(2, "0")}</div><em>在 index.html 的 CONFIG 里替换</em></div>`;
  }
  return `<div class="polaroid" style="--r:${r1.toFixed(2)}deg;--r2:${r2.toFixed(2)}deg">
      <div class="tape"></div>${ph}
      <div class="cap">${T(ex.caption || "")}</div>
    </div>`;
}

  }, { threshold: .5, rootMargin: "0px 0px -12% 0px" });
  document.querySelectorAll(".letter .q,.letter .answer").forEach(el => io.observe(el));
}

/* ── 入场 & 滚动点亮 ── */
const lit = new Set();
function setupObservers(){
  const io = new IntersectionObserver(es => {
    for (const e of es){
      if (e.isIntersecting){
        e.target.classList.add("in");
        if (e.target.dataset.i !== undefined){
          lit.add(e.target.dataset.i);
          $("pCount").textContent = lit.size;
        }
        io.unobserve(e.target);
      }
    }
  }, { threshold: .22, rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".exhibit,#prologue,#finale").forEach(el => io.observe(el));
  // 进度条只在展厅区域显示
  new IntersectionObserver(es => {
    $("progress").classList.toggle("show", es[0].isIntersecting);
  }, { threshold: 0 }).observe($("hall"));
}

/* 网易云：先试着唤起 App，唤不起来就跳网页版 */
function neteaseUrls(){
  const m = CONFIG.music || {};
  const id = String(m.songId || "").trim();
  const web = (m.webUrl || "").trim() || (id ? `https://music.163.com/#/song?id=${id}` : "");
  return { id, web, app: id ? `orpheus://song/${id}` : "" };
}
let appTried = false;
function openNetease(){
  const { app, web } = neteaseUrls();
  if (!web && !app) return;
  const card = document.querySelector(".mcard");
  if (card) card.classList.add("on");

  if (app && !appTried){
    appTried = true;
    const t0 = Date.now();
    const go = () => {
      // 1.2 秒内页面没被切走，说明 App 没唤起 → 退回网页版
      if (Date.now() - t0 < 1500 && !document.hidden){ window.open(web, "_blank"); }
    };
    try { window.location.href = app; } catch (e) { window.open(web, "_blank"); return; }
    setTimeout(go, 1200);
  } else {
    window.open(web, "_blank");
  }
}

/* ── 星海 ── */
const sc = $("sc"), cctx = sc.getContext("2d");
let seaW = 0, seaH = 0, seaReady = false, inSea = false;
/* 星海自适应布局：不管放几个展品，星星都会自动错落铺开，不会挤在一起 */
const fract = v => v - Math.floor(v);
const hash  = (i, k) => fract(Math.sin(i * (12.9898 + k * 7.13) + k * 4.1) * 43758.5453);
function seaLayout(n){
  const cols = n <= 4 ? 2 : n <= 6 ? 3 : n <= 12 ? 4 : n <= 20 ? 5 : 6;
  const rows = Math.ceil(n / cols);
  const x0 = .11, x1 = .89, y0 = .16, y1 = n > 16 ? .40 : .44;
  const cw = (x1 - x0) / cols, ch = (y1 - y0) / rows;
  const pts = [];
  for (let i = 0; i < n; i++){
    const c = i % cols, r = Math.floor(i / cols);
    let cx = x0 + c * cw + cw / 2 + (r % 2 ? cw * .5 : 0);
    if (cx > x1) cx -= (x1 - x0);
    pts.push([
      cx + (hash(i, 1) - .5) * cw * .5,
      y0 + r * ch + ch / 2 + (hash(i, 2) - .5) * ch * .5
    ]);
  }
  return pts;
}
let seaStars = [], consStars = null, consT = 0, consLines = null, consDone = false, pulse = 0;
const tapped = new Set();

function sizeSea(){
  const r = sc.getBoundingClientRect();
  seaW = r.width; seaH = r.height;
  sc.width = seaW * DPR; sc.height = seaH * DPR;
  cctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  buildSeaStars();
}
let dust = [];
function buildSeaStars(){
  const n = CONFIG.exhibits.length;
  const layout = seaLayout(n);
  seaStars = layout.map((p, i) => ({
    x: p[0] * seaW,
    y: p[1] * seaH,
    r: n > 16 ? 3.4 : n > 12 ? 3.9 : 4.4 + hash(i, 3) * 1.8,
    ph: hash(i, 4) * 6.28,
    i
  }));
  dust = Array.from({ length: 110 }, () => ({
    x: Math.random() * seaW, y: seaH * (.06 + Math.random() * .82),
    r: Math.random() * .9 + .25, a: Math.random() * .35 + .1, ph: Math.random() * 6.28
  }));
}
function drawSea(t){
  if (!inSea && !consDone) return;
  cctx.clearRect(0, 0, seaW, seaH);

  // 尘埃星（营造深度）
  for (const d of dust){
    const tw = .5 + .5 * Math.sin(t * .0016 + d.ph);
    cctx.beginPath(); cctx.arc(d.x, d.y + Math.sin(t * .0009 + d.ph) * 4, d.r, 0, 6.2832);
    cctx.fillStyle = `rgba(200,214,246,${d.a * tw})`; cctx.fill();
  }

  // 星座（成型中 / 已成型）
  if (consStars){
    const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const e = ease(Math.min(consT, 1));
    cctx.save();
    if (consT > .82 && consLines){
      const la = Math.min((consT - .82) / .5, 1) * .17;
      cctx.strokeStyle = `rgba(242,193,122,${la})`; cctx.lineWidth = .7;
      for (const [a, b] of consLines){
        cctx.beginPath(); cctx.moveTo(a.x, a.y); cctx.lineTo(b.x, b.y); cctx.stroke();
      }
    }
    for (const s of consStars){
      const x = s.sx + (s.tx - s.sx) * e, y = s.sy + (s.ty - s.sy) * e;
      const tw = .55 + .45 * Math.sin(t * .0022 + s.ph);
      const a = Math.min(consT / .35, 1) * tw * s.a;
      cctx.beginPath(); cctx.arc(x, y, s.r, 0, 6.2832);
      cctx.fillStyle = `rgba(255,220,166,${a})`; cctx.fill();
      if (s.big){
        const gg = cctx.createRadialGradient(x, y, 0, x, y, 16);
        gg.addColorStop(0, `rgba(242,193,122,${a * .5})`); gg.addColorStop(1, "rgba(242,193,122,0)");
        cctx.fillStyle = gg; cctx.beginPath(); cctx.arc(x, y, 16, 0, 6.2832); cctx.fill();
      }
    }
    cctx.restore();
  }

  // 八颗记忆星
  const fade = consDone ? 1 : 1;
  for (const s of seaStars){
    const tw = .6 + .4 * Math.sin(t * .0019 + s.ph);
    const isTap = tapped.has(s.i);
    const fy = Math.sin(t * .0007 + s.ph) * 5;
    const rr = s.r + (isTap ? 1.8 : 0) + Math.sin(t * .0014 + s.ph) * .6;
    const sy = s.y + fy;
    cctx.save();
    const g = cctx.createRadialGradient(s.x, sy, 0, s.x, sy, rr * 6);
    g.addColorStop(0, `rgba(242,193,122,${(isTap ? .6 : .34) * tw})`);
    g.addColorStop(1, "rgba(242,193,122,0)");
    cctx.fillStyle = g; cctx.beginPath(); cctx.arc(s.x, sy, rr * 6, 0, 6.2832); cctx.fill();
    cctx.beginPath(); cctx.arc(s.x, sy, rr, 0, 6.2832);
    cctx.fillStyle = `rgba(255,226,180,${(isTap ? 1 : .8) * tw})`; cctx.fill();
    if (isTap){
      cctx.beginPath(); cctx.arc(s.x, sy, rr + 8 + Math.sin(t * .0016 + s.ph) * 2, 0, 6.2832);
      cctx.strokeStyle = `rgba(242,193,122,${.3 * tw})`; cctx.lineWidth = 1; cctx.stroke();
    }
    // 日期标签（展品多的时候只标已点亮的，免得文字糊成一团）
    const showLabel = seaStars.length <= 12 || isTap;
    if (showLabel){
      cctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
      cctx.textAlign = "center";
      cctx.fillStyle = `rgba(160,174,206,${isTap ? .95 : .62})`;
      cctx.fillText(T(CONFIG.exhibits[s.i].date), s.x, sy + rr + 17);
    }
    cctx.restore();
  }
}

/* 点星 */
sc.addEventListener("click", e => {
  const r = sc.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  let best = null, bd = 30;
  for (const s of seaStars){
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bd){ bd = d; best = s; }
  }
  if (!best) return;
  if (best){ tapped.add(best.i); openCard(best.i); }
});

/* 文字点阵 → 星座目标点 */
function sampleText(text, want){
  const S = 260;
  const cv = document.createElement("canvas"); cv.width = S; cv.height = S;
  const cx = cv.getContext("2d");
  cx.fillStyle = "#fff"; cx.textAlign = "center"; cx.textBaseline = "middle";
  const fs = text.length <= 1 ? S * .78 : text.length === 2 ? S * .58 : S * .44;
  cx.font = `600 ${fs}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif`;
  cx.fillText(text, S / 2, S / 2 + fs * .02);
  const d = cx.getImageData(0, 0, S, S).data;
  const pts = [];
  for (let py = 0; py < S; py += 5){
    for (let px = 0; px < S; px += 5){
      if (d[(py * S + px) * 4 + 3] > 130) pts.push([px / S, py / S]);
    }
  }
  // 打散后均匀抽取
  for (let i = pts.length - 1; i > 0; i--){ const j = (Math.random() * (i + 1)) | 0; [pts[i], pts[j]] = [pts[j], pts[i]]; }
  return pts.slice(0, want);
}

/* 天秤座天平：归一化坐标（y 向下），以及亮星之间的连线 */
const LIBRA_NODES = [
  //   x     y    亮星?
  [0.500, 0.04, 1],   // β 氐宿四（最亮，天平顶端）
  [0.255, 0.31, 1],   // σ
  [0.745, 0.31, 1],   // α 氐宿一
  [0.150, 0.62, 0],   // δ
  [0.850, 0.64, 0],   // γ
  [0.275, 0.92, 1],   // υ（左秤盘）
  [0.725, 0.93, 1]    // τ（右秤盘）
];
const LIBRA_LINKS = [[0,1],[0,2],[1,3],[2,4],[3,5],[4,6]];

function buildConstellation(){
  const shape = CONFIG.constellationShape || "text";
  let mapped = [], links = [], bigSet = new Set();

  if (shape === "libra"){
    // ── 天秤座天平 ──
    const boxW = seaW * .60, boxH = Math.min(seaH * .30, 220);
    const ox = (seaW - boxW) / 2, oy = seaH * (CONFIG.exhibits.length > 16 ? .46 : .47);
    const nodePts = LIBRA_NODES.map(([px, py]) => ({ x: ox + px * boxW, y: oy + py * boxH }));

    // 沿每条连线撒星（线段上均匀取点 + 轻微抖动）
    const PER = 26;
    LIBRA_LINKS.forEach(([a, b]) => {
      const A = nodePts[a], B = nodePts[b];
      for (let k = 0; k <= PER; k++){
        const t = k / PER;
        const jx = (Math.random() - .5) * 3.2, jy = (Math.random() - .5) * 3.2;
        mapped.push({ x: A.x + (B.x - A.x) * t + jx, y: A.y + (B.y - A.y) * t + jy });
      }
    });
    // 亮星位置额外堆一小簇，做成「节点发光」的效果
    nodePts.forEach((p, i) => {
      if (!LIBRA_NODES[i][2]) return;
      for (let k = 0; k < 26; k++){
        const ang = Math.random() * 6.28, rad = Math.random() * 9;
        mapped.push({ x: p.x + Math.cos(ang) * rad, y: p.y + Math.sin(ang) * rad });
      }
    });
    links = LIBRA_LINKS.map(([a, b]) => [nodePts[a], nodePts[b]]);
    // 亮星画大一点
    const bigIdx = new Set();
    LIBRA_LINKS.forEach(([a, b]) => { bigIdx.add(mapped.length); });
  } else {
    // ── 文字点阵（原来的模式）──
    const text = CONFIG.constellation || N();
    const boxW = seaW * .74, boxH = Math.min(seaH * .26, 190);
    const ox = (seaW - boxW) / 2, oy = seaH * (CONFIG.exhibits.length > 16 ? .46 : .49);
    const pts = sampleText(text, 300);
    if (!pts.length) return;
    mapped = pts.map(([px, py]) => ({ x: ox + px * boxW, y: oy + py * boxH }));
    const step = 3;
    for (let i = 0; i < mapped.length; i += step){
      for (let j = i + step; j < mapped.length; j += step){
        const d = Math.hypot(mapped[i].x - mapped[j].x, mapped[i].y - mapped[j].y);
        if (d < boxH * .17) links.push([mapped[i], mapped[j]]);
      }
    }
    bigSet = new Set(); for (let i = 0; i < mapped.length; i += 17) bigSet.add(i);
  }

  consStars = mapped.map((p, i) => {
    const ang = Math.random() * 6.28, dist = Math.max(seaW, seaH) * (.5 + Math.random() * .5);
    const near = shape === "libra"
      ? LIBRA_NODES.some(([nx, ny, isBig]) => {
          if (!isBig) return false;
          return Math.random() < .5 && i % 31 === 0;
        })
      : false;
    return {
      sx: seaW / 2 + Math.cos(ang) * dist, sy: seaH / 2 + Math.sin(ang) * dist * .7,
      tx: p.x, ty: p.y,
      r: (shape === "libra" ? (i % 23 === 0 ? 2.4 : 1.05 + Math.random() * .5)
                            : (bigSet.has(i) ? 2.2 : 1.15 + Math.random() * .5)),
      big: shape === "libra" ? i % 23 === 0 : bigSet.has(i),
      a: .55 + Math.random() * .45,
      ph: Math.random() * 6.28
    };
  });
  consLines = links;
  consT = 0;
}

$("linkBtn").addEventListener("click", () => {

/* ── 离线保存：把照片、音乐全部转成内嵌数据，存成一个文件 ── */
async function toDataURL(url){
  if (!url || url.startsWith("data:")) return url;
  try{
    const r = await fetch(url, { mode: "cors" });
    const b = await r.blob();
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = () => res(fr.result);
      fr.onerror = () => res(url);
      fr.readAsDataURL(b);
    });
  }catch(e){ return url; }
}

$("keepBtn").addEventListener("click", async () => {
  const btn = $("keepBtn"), tip = $("keepTip");
  btn.disabled = true; btn.textContent = "正在打包…"; tip.textContent = "照片和音乐正在装进去，稍等几秒。";

  // 收集 CONFIG 里用到的所有外部文件
  const urls = new Set();
  const addP = v => { if (!v) return; (Array.isArray(v) ? v : [v]).forEach(u => u && urls.add(u)); };
  addP(CONFIG.prologue.photo);
  CONFIG.exhibits.forEach(e => addP(e.photo));
  addP(CONFIG.voiceSrc);
  if (CONFIG.bgPhotos){ addP(CONFIG.bgPhotos.gate); addP(CONFIG.bgPhotos.finale); }
  if (CONFIG.music && CONFIG.music.cover) addP(CONFIG.music.cover);
  const L = CONFIG.finale && CONFIG.finale.letter;
  if (L) addP(L.embroidery);
  const mSrc = (CONFIG.musicSrc === "embedded") ? EMBEDDED_MUSIC : CONFIG.musicSrc;
  if (mSrc) urls.add(mSrc);

  const list = [...urls].filter(u => u && !u.startsWith("data:"));
  const map = new Map();
  await Promise.all(list.map(async u => map.set(u, await toDataURL(u))));

  const clone = document.documentElement.cloneNode(true);

  // ① 把脚本里的路径也换掉（否则重新渲染时又会去找外部文件）
  clone.querySelectorAll("script").forEach(sc => {
    let t = sc.textContent;
    map.forEach((d, u) => { t = t.split('"' + u + '"').join('"' + d + '"'); });
    sc.textContent = t;
  });
  // ② 页面上已经渲染出来的 img / audio 也换掉
  clone.querySelectorAll("img[src]").forEach(el => {
    const u = el.getAttribute("src");
    if (u && map.has(u)) el.setAttribute("src", map.get(u));
  });
  ["bgm", "voice"].forEach(id => {
    const el = clone.querySelector("#" + id);
    if (!el) return;
    const u = el.getAttribute("src") || ($(id) || {}).src || "";
    if (map.has(u)) el.setAttribute("src", map.get(u));
    else if (id === "bgm" && map.has(mSrc)) el.setAttribute("src", map.get(mSrc));
  });

  // 复位成「第一次打开」的状态，让她存下来的是完整体验
  const g = clone.querySelector("#gate");
  if (g) g.removeAttribute("style");
  clone.querySelectorAll(".in").forEach(el => el.classList.remove("in"));
  clone.querySelectorAll("img[loading]").forEach(el => el.removeAttribute("loading"));
  const mb = clone.querySelector("#musicBtn"); if (mb) mb.className = "show";
  const lb = clone.querySelector("#linkBtn"); if (lb) lb.className = "";
  const cb = clone.querySelector("#card"); if (cb) cb.className = "";
  const w = clone.querySelector("#wish");
  if (w) w.textContent = $("wish").value;   // 把她写下的话也带进去

  const html = "<!DOCTYPE html>\n" + clone.outerHTML;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `致${N()}的两年.html`;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);

  btn.textContent = "已经存好了";
  const mb2 = (blob.size / 1024 / 1024).toFixed(1);
  tip.textContent = `共 ${mb2} MB，在「下载」文件夹里。以后不联网、不用这个链接，双击也能打开。`;
});

/* ── NASA 背景星空 ── */
function setupBgPhotos(){
  const cfg = CONFIG.bgPhotos || {};
  const box = $("bgPhoto");
  if (!box) return;
  const items = [];
  if (cfg.gate)   items.push({ src: cfg.gate,   el: "gate",   target: $("gate") });
  if (cfg.finale) items.push({ src: cfg.finale, el: "finale", target: $("finale") });
  if (!items.length){ box.style.display = "none"; return; }

  box.innerHTML = items.map((it, i) =>
    `<img class="bgi" data-i="${i}" src="${it.src}" alt="">`).join("");
  const imgs = [...box.querySelectorAll(".bgi")];

  // 哪个区块进入视野，就淡入对应的那张
  const show = i => imgs.forEach((im, k) => im.classList.toggle("on", k === i));
  const io = new IntersectionObserver(es => {
    for (const e of es){ if (e.isIntersecting){ show(+e.target.dataset.i); break; } }
  }, { threshold: .35 });
  items.forEach((it, i) => { if (it.target){ it.target.dataset.i = i; io.observe(it.target); } });

  // 兜底：滚动到尾声时也切一次
  window.addEventListener("scroll", () => {
    const y = window.scrollY, H = document.body.scrollHeight;
    if (y > H * .82) show(imgs.length - 1);
    else if (y < H * .12) show(0);
  }, { passive: true });

  show(0);
}
